<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Cornice smussata -->
  <rect x="10" y="10" width="180" height="180" rx="20" fill="none" stroke="#000000" stroke-width="12" />

  <!-- Punti rotondi -->
  <circle cx="75" cy="35" r="7" fill="#000000" />
  <circle cx="105" cy="80" r="7" fill="#000000" />

  <!-- Tracciati sinuosi -->
  <g fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gamba della 'j' con curva profonda -->
    <path d="M 75 55 L 75 125 C 75 155, 45 160, 45 140" />
    
    <!-- Barra trasversale con leggera curva a 'S' -->
    <path d="M 45 95 C 65 95, 80 65, 105 60" />
    
    <!-- Asta della 'k' -->
    <path d="M 105 100 L 105 160" />
    
    <!-- Braccia della 'k' ammorbidite -->
    <path d="M 105 130 C 120 130, 130 115, 145 105" />
    <path d="M 105 130 C 120 130, 135 150, 150 165" />
  </g>
</svg>